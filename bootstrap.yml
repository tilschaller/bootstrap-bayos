general:
  patch_author: Til Schaller
  everything_by_default: false

sources:
  - name: bayos-kernel
    git: 'https://github.com/tilschaller/bayos-kernel'
    branch: 'master'
    rolling_version: true
  - name: limine
    git: 'https://github.com/limine-bootloader/limine'
    branch: 'v11.x-binary'
    rolling_version: true
  - name: gcc
    git: 'https://github.com/gcc-mirror/gcc'
    branch: 'releases/gcc-16'
    rolling_version: true
  - name: binutils
    git: 'https://github.com/gnutools/binutils-gdb'
    branch: 'binutils-2_46-branch'
    rolling_version: true
  - name: mlibc
    git: 'https://github.com/managarm/mlibc'
    branch: 'v6.x'
    rolling_version: true

tools:
  - name: host-limine
    from_source: limine
    compile:
      - args: ['make']
        workdir: '@THIS_SOURCE_DIR@'
    install:
      - args: ['mkdir', '-p', '@PREFIX@/bin']
      - args: ['cp', '-v', '@THIS_SOURCE_DIR@/limine', '@PREFIX@/bin/limine']
  - name: mlibc-headers
    from_source: mlibc
    configure:
      - args:
        - 'meson'
        - 'setup'
        - '--cross-file'
        - '@THIS_SOURCE_DIR@/mlibc-bayos.txt'
        - '--prefix=/usr'
        - '@THIS_SOURCE_DIR@'
        - '-Dheaders_only=true'
    compile:
      - args: ['ninja']
    install:
      - args: ['ninja', 'install']
        environ:
          DESTDIR: '@SYSROOT_DIR@'
  - name: binutils
    from_source: binutils
    tools_required:
      - mlibc-headers
    configure:
      - args:
        - '@THIS_SOURCE_DIR@/configure'
        - '--target=x86_64-bayos'
        - '--prefix=@PREFIX@'
        - '--with-sysroot=@SYSROOT_DIR@'
        - '--disable-werror'
        - '--enable-default-execstack=no'
    compile:
      - args: ['make', '-j@PARALLELISM@']
      - args: ['make', 'install']
  - name: gcc
    from_source: gcc
    tools_required: 
      - binutils
    configure:
      - args:
        - '@THIS_SOURCE_DIR@/configure'
        - '--target=x86_64-bayos'
        - '--prefix=@PREFIX@'
        - '--with-sysroot=@SYSROOT_DIR@'
        - '--enable-languages=c,c++'
        - '--enable-threads=posix'
        - '--disable-multilib'
        - '--enable-shared'
        - '--enable-host-shared'
    compile:
      - args: ['make', '-j@PARALLELISM@', 'all-gcc', 'all-target-libgcc']
      - args: ['make', 'install-gcc', 'install-target-libgcc']

packages:
  - name: bayos-kernel
    default: true
    from_source: bayos-kernel
    configure:
      - args:
          - 'meson'
          - 'setup'
          - '@THIS_SOURCE_DIR@'
    build:
      - args: ['ninja']
      - args: ['mkdir', '-p', '@BUILD_ROOT@/iso/boot']
      - args: ['ninja', 'install']
        environ:
          DESTDIR: '@BUILD_ROOT@/iso/boot'
  - name: limine
    default: true
    from_source: limine
    tools_required:
      - host-limine
    build:
      - args: ['mkdir', '-p', '@BUILD_ROOT@/iso/boot/limine']
      - args: ['mkdir', '-p', '@BUILD_ROOT@/iso/EFI/BOOT']
      - args:
        - 'cp'
        - '-v'
        - '@THIS_SOURCE_DIR@/limine-bios.sys'
        - '@THIS_SOURCE_DIR@/limine-bios-cd.bin'
        - '@THIS_SOURCE_DIR@/limine-uefi-cd.bin'
        - '@BUILD_ROOT@/iso/boot/limine'
      - args: ['cp', '-v', '@THIS_SOURCE_DIR@/BOOTX64.EFI', '@BUILD_ROOT@/iso/EFI/BOOT']
      - args: ['cp', '-v', '@THIS_SOURCE_DIR@/BOOTIA32.EFI', '@BUILD_ROOT@/iso/EFI/BOOT']
      - args: ['cp', '-v', '@SOURCE_ROOT@/limine.conf', '@BUILD_ROOT@/iso/boot/limine/limine.conf']
  - name: mlibc
    default: true
    from_source: mlibc
    tools_required:
      - gcc
      - mlibc-headers
      - binutils
    configure:
      - args:
          - 'meson'
          - 'setup'
          - '--cross-file'
          - '@THIS_SOURCE_DIR@/mlibc-bayos.txt'
          - '--prefix=/usr'
          - '-Ddefault_library=static'
          - '-Dno_headers=true'
          - '@THIS_SOURCE_DIR@'
    build:
      - args: ['ninja']
      - args: ['ninja', 'install']
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'

tasks:
  - name: initramfs
    args: ['mkdir', '-p', '@BUILD_ROOT@/iso/boot']
    args: ['tar', '-cf', '@BUILD_ROOT@/iso/boot/initramfs.tar', '@SYSROOT_DIR@']
    pkgs_required:
      - bayos-kernel
      - limine
      - mlibc
  - name: iso
    pkgs_required:
      - bayos-kernel
      - limine
    tools_required:
      - host-limine
    tasks_required:
      - initramfs
    args:
      - 'bash'
      - '@SOURCE_ROOT@/scripts/make_iso.sh'
      - '@BUILD_ROOT@'
  - name: qemu
    tasks_required:
      - iso
    args:
        - 'qemu-system-x86_64'
        - '-cdrom'
        - '@BUILD_ROOT@/bayos.iso'
        - '-monitor'
        - 'stdio'
        - '-m'
        - '4G'
        - '-boot'
        - 'd'
        - '-M'
        - 'q35'
